name: Release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      snapshot_version:
        description: "Base version for a GitHub Packages snapshot, for example 0.8.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ github.ref_name }}
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - name: Stamp release version
        if: github.event_name == 'push'
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Stamp snapshot base version
        if: github.event_name == 'workflow_dispatch'
        env:
          SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}
        run: ./scripts/release.sh "$SNAPSHOT_VERSION"

      - name: Test release script
        run: ./scripts/release-test.sh

      - name: Lint and test
        run: ./gradlew spotlessCheck detekt lint jvmTest

  publish-release:
    name: Publish ${{ github.ref_name }}
    if: github.event_name == 'push'
    needs: verify
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - name: Stamp release version
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Read release metadata
        id: release-metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version_without_build="${RELEASE_VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.release-metadata.outputs.prerelease }}

  publish-snapshot:
    name: Publish ${{ inputs.snapshot_version }} snapshot
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-26
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: gradle

      - name: Stamp snapshot version
        env:
          SNAPSHOT_VERSION: ${{ inputs.snapshot_version }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          ./scripts/release.sh "${SNAPSHOT_VERSION}-snapshot-$short_sha"

      - name: Publish to GitHub Packages
        run: |
          ./gradlew publishAllPublicationsToGitHubPackagesRepository \
            -PuseGitHubPublishing \
            -PgitCommit="${GITHUB_SHA::7}" \
            --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_githubToken: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
