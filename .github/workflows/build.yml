name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Newer PR commits (and pushes) supersede in-flight runs so stale CI does not
# keep burning macos runners or block the latest commit's checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint & Test
        run: ./gradlew spotlessCheck detekt lint jvmTest

      - name: Build
        run: ./gradlew :foundations:assemble :content-color:assemble :style:assemble :layout:container:assemble :components:button:assemble