name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Newer PR commits (and pushes) supersede in-flight runs so stale CI does not
# keep burning macos runners or block the latest commit's checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - name: set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint & Test
        run: ./gradlew spotlessCheck detekt lint jvmTest

      - name: Build
        run: ./gradlew :foundations:assemble :content-color:assemble :style:assemble :layout:container:assemble :components:button:assemble

  screenshot_tests:
    name: Screenshot tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: 21, distribution: zulu, cache: gradle }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playbook/web/screenshot-tests/package-lock.json
      - run: chmod +x gradlew scripts/verify-screenshot-assets.sh
      - run: npm ci --prefix playbook/web/screenshot-tests
      - run: npx --prefix playbook/web/screenshot-tests playwright install chromium
      - run: ./gradlew verifyHostScreenshots :playbook:web:prepareScreenshotDistributions
      - run: npm --prefix playbook/web/screenshot-tests test
      - run: ./scripts/verify-screenshot-assets.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-artifacts
          path: |
            **/build/reports/roborazzi/**
            **/build/outputs/roborazzi/**
            playbook/web/screenshot-tests/test-results/**
            playbook/web/screenshot-tests/playwright-report/**
